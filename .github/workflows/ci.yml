name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "4.2", db: sqlite }
          - { python: "3.12", django: "5.2", db: sqlite }
          - { python: "3.13", django: "5.2", db: postgres }
          - { python: "3.13", django: "6.0", db: postgres }
          - { python: "3.14", django: "6.1", db: sqlite }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flex_blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      FLEX_BLOG_TEST_DB: ${{ matrix.db }}
      REDIS_URL: ${{ matrix.db == 'postgres' && 'redis://localhost:6379/0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django~=${{ matrix.django }}.0" -e ".[test,celery,postgres]" redis
      - run: python -m django makemigrations flex_blog --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
      - run: pytest --cov --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
